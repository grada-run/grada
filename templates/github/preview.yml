name: Ephemeral PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One runner per PR: rapid pushes cancel superseded previews instead of
# overlapping applies on the same workspace. Shares its group with
# teardown.yml, which queues (never cancels) behind an in-flight deploy.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: {{REGION}}
  ECR_REPOSITORY: {{PROJECT_NAME}}{{RESOURCE_SUFFIX}}-repo
  WORKSPACE: pr-${{ github.event.pull_request.number }}

permissions:
  id-token: write
  contents: read
  pull-requests: write # Required to post the comment

jobs:
  deploy-preview:
    name: Provision Preview Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::{{AWS_ACCOUNT_ID}}:role/{{PROJECT_NAME}}{{RESOURCE_SUFFIX}}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # We tag the image specifically for this PR workspace
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.WORKSPACE }} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.WORKSPACE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        id: tf-apply
        working-directory: ./terraform
        run: |
          terraform init -input=false
          # Create or select the workspace specific to this PR
          terraform workspace select -or-create ${{ env.WORKSPACE }}
          terraform apply -auto-approve
          
          # Extract the CloudFront URL to post to GitHub (the ALB origin
          # accepts CloudFront edges only — its direct URL is not browsable)
          PREVIEW_URL=$(terraform output -raw cloudfront_url)
          echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_ENV

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview Environment Deployed!**\n\nYour ephemeral AWS Fargate environment is live at:\n[${process.env.PREVIEW_URL}](${process.env.PREVIEW_URL})\n\n_This environment will be automatically destroyed when the PR is merged or closed._\n\n---\n<div align="right"><sup>☁️ Generated by <a href="https://github.com/grada-run/grada">Grada</a></sup></div>`
            })