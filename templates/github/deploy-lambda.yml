name: Deploy to AWS Lambda

on:
  push:
    branches:
      - {{DEPLOY_BRANCH}}

# Overlapping deploys race: each run publishes its own image and calls
# update-function-code, so a stale run finishing last would silently
# regress production. Superseded runs cancel instead — newest always wins.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: {{REGION}}
  ECR_REPOSITORY: {{PROJECT_NAME}}{{RESOURCE_SUFFIX}}-repo
  LAMBDA_FUNCTION: {{PROJECT_NAME}}{{RESOURCE_SUFFIX}}-fn
  CF_COMMENT: {{PROJECT_NAME}}{{RESOURCE_SUFFIX}}-cdn

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. IaC SECURITY SCAN ---
      - name: Scan Terraform for Misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'terraform/'
          scanners: 'vuln,secret,misconfig'
          format: 'table'
          exit-code: '0' # Informational only, will not break the build
          severity: 'CRITICAL,HIGH'
          output: 'trivy-iac-summary.txt'

      - name: Publish IaC Summary
        if: always()
        run: |
          if [ -f trivy-iac-summary.txt ]; then
            echo "### 🏗️ Terraform Misconfiguration Scan" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat trivy-iac-summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # --- 2. INFRASTRUCTURE SYNC (The New Marketplace Action) ---
      - name: Apply Infrastructure Changes
        uses: grada-run/grada-action@v1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::{{AWS_ACCOUNT_ID}}:role/{{PROJECT_NAME}}{{RESOURCE_SUFFIX}}-github-actions-role
          terraform-dir: 'terraform'

      # --- 3. BUILD & PUSH ---
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          # The Lambda function runs on x86_64 (see terraform/main.tf), so the
          # image must be built for linux/amd64 even on arm64 runners.
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # --- 4. CONTAINER SECURITY SCAN ---
      - name: Scan Container for Vulnerabilities (SARIF Output)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest'
          format: 'table'
          output: 'trivy-container-summary.txt'
          exit-code: '0' # Informational only, will not break the build
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Publish Container Summary
        if: always()
        run: |
          if [ -f trivy-container-summary.txt ]; then
            echo "### 🛡️ Container Security Scan Results" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat trivy-container-summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # --- 5. DEPLOY ---
      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG" >> $GITHUB_OUTPUT

      # Each code push deploys the immutable SHA-tagged image to the Lambda
      # function, so every ECR tag stays a redeployable rollback point (and
      # `latest` is never the deploy artifact of record).
      - name: Deploy image to AWS Lambda
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${GITHUB_SHA::7}
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION }} \
            --image-uri "$IMAGE_URI" \
            --region ${{ env.AWS_REGION }}
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION }} \
            --region ${{ env.AWS_REGION }}

      # --- 6. CACHE INVALIDATION ---
      # New code means new HTML: clear the CDN so deploys go live
      # immediately instead of serving stale pages until TTL expiry.
      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='${{ env.CF_COMMENT }}'].Id | [0]" \
            --output text \
            --region ${{ env.AWS_REGION }})
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "CloudFront distribution '${{ env.CF_COMMENT }}' not found." >&2
            exit 1
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*" \
            --region ${{ env.AWS_REGION }}
