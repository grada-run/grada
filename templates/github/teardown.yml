name: Destroy PR Preview

on:
  pull_request:
    types: [closed]

# Shared with the preview workflow: teardown queues behind an in-flight
# deploy instead of racing it on the state lock. No cancel-in-progress —
# a teardown must run to completion, never be skipped.
concurrency:
  group: preview-${{ github.event.pull_request.number }}

env:
  AWS_REGION: {{REGION}}
  WORKSPACE: pr-${{ github.event.pull_request.number }}

permissions:
  id-token: write
  contents: read

jobs:
  destroy-preview:
    name: Teardown Preview Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::{{AWS_ACCOUNT_ID}}:role/{{PROJECT_NAME}}{{RESOURCE_SUFFIX}}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Destroy
        working-directory: ./terraform
        run: |
          terraform init -input=false
          # PRs that never got a preview (early failure, pre-previews PR)
          # have no workspace — exit green instead of failing the run. But
          # a failed listing (backend outage, dead creds) must stay red:
          # matching against empty output would leak the stack silently.
          WORKSPACES=$(terraform workspace list 2>&1) || { echo "$WORKSPACES"; exit 1; }
          if ! printf '%s\n' "$WORKSPACES" | sed 's/^[* ]*//' | grep -qx "${{ env.WORKSPACE }}"; then
            echo "No preview workspace ${{ env.WORKSPACE }} — nothing to tear down."
            exit 0
          fi
          # Select the PR workspace
          terraform workspace select ${{ env.WORKSPACE }}
          # Destroy all resources in this workspace safely
          terraform destroy -auto-approve
          # Switch back to default and delete the PR workspace
          terraform workspace select default
          terraform workspace delete ${{ env.WORKSPACE }}