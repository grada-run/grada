name: Deploy static site to S3 + CloudFront

on:
  push:
    branches:
      - {{DEPLOY_BRANCH}}

# Overlapping deploys race: each run syncs its own build with --delete, so
# interleaved runs would publish a mixed old/new file set. Superseded runs
# cancel instead — newest always wins.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: {{REGION}}
  S3_BUCKET: {{PROJECT_NAME}}{{RESOURCE_SUFFIX}}-site-{{AWS_ACCOUNT_ID}}
  BUILD_DIR: {{BUILD_DIR}}
  CF_COMMENT: {{PROJECT_NAME}}{{RESOURCE_SUFFIX}}-cdn

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # --- 1. IaC SECURITY SCAN ---
      - name: Scan Terraform for Misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'terraform/'
          scanners: 'vuln,secret,misconfig'
          format: 'table'
          exit-code: '0' # Informational only, will not break the build
          severity: 'CRITICAL,HIGH'
          output: 'trivy-iac-summary.txt'

      - name: Publish IaC Summary
        if: always()
        run: |
          if [ -f trivy-iac-summary.txt ]; then
            echo "### 🏗️ Terraform Misconfiguration Scan" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat trivy-iac-summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # --- 2. AWS AUTH (job-level credentials for every step below) ---
      - name: Configure AWS credentials
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        continue-on-error: true
        with:
          role-to-assume: arn:aws:iam::{{AWS_ACCOUNT_ID}}:role/{{DEPLOY_ROLE_NAME}}
          aws-region: ${{ env.AWS_REGION }}

      # Deploy never skips: a failed assume fails the run with the
      # bootstrap pointer.
      - name: Interpret credential failure
        if: steps.aws-creds.outcome == 'failure'
        run: |
          echo "::error::AWS credential assumption failed — if the stack was never provisioned, bootstrap it first (npx grada-run apply); otherwise check terraform/oidc.tf trust."
          exit 1

      # --- 3. INFRASTRUCTURE SYNC (The New Marketplace Action) ---
      - name: Apply Infrastructure Changes
        uses: grada-run/grada-action@12227808ae4caafaec1041319645586a1132fc57 # v1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::{{AWS_ACCOUNT_ID}}:role/{{DEPLOY_ROLE_NAME}}
          terraform-dir: 'terraform'

      # --- 4. BUILD ---
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build static site
        run: |
          npm ci
          npm run build

      # --- 5. DEPLOY ---
      - name: Sync to S3
        run: |
          aws s3 sync "${{ env.BUILD_DIR }}/" "s3://${{ env.S3_BUCKET }}" --delete \
            --region ${{ env.AWS_REGION }}

      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='${{ env.CF_COMMENT }}'].Id | [0]" \
            --output text \
            --region ${{ env.AWS_REGION }})
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "CloudFront distribution '${{ env.CF_COMMENT }}' not found." >&2
            exit 1
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*" \
            --region ${{ env.AWS_REGION }}
