name: IaC Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        framework: [nestjs, nextjs, nuxt, node, svelte, static, python, django, rails, go]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scaffold app (${{ matrix.framework }})
        env:
          CI_MOCK_AWS: 'true'
          DO_NOT_TRACK: '1'
        run: |
          TMPROOT=$(mktemp -d)
          APP_DIR="$TMPROOT/test-app-${{ matrix.framework }}"
          mkdir -p "$APP_DIR"
          echo "GENERATED_DIR=$APP_DIR" >> "$GITHUB_ENV"
          cd "$APP_DIR"
          node "$GITHUB_WORKSPACE/bin/cli.js" --headless --preconfigured --framework=${{ matrix.framework }}

      - name: Terraform Compile
        working-directory: ${{ env.GENERATED_DIR }}/terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Init TFLint
        working-directory: ${{ env.GENERATED_DIR }}/terraform
        run: tflint --init

      - name: Terraform Lint
        working-directory: ${{ env.GENERATED_DIR }}/terraform
        run: tflint

      - name: DevSecOps Scan (IaC Config)
        # Same blocking command as `npm run test:iac` (Phase 1): fails the PR
        # on any HIGH/CRITICAL misconfiguration. pipefail keeps the tee'd
        # summary file without swallowing Trivy's exit code.
        run: |
          set -o pipefail
          docker run --rm -v "${{ env.GENERATED_DIR }}:/src" aquasec/trivy config --exit-code 1 --severity HIGH,CRITICAL /src | tee trivy-fs-results.txt

      - name: Build Container Image
        working-directory: ${{ env.GENERATED_DIR }}
        run: |
          awk '
            /^COPY/ { next }
            /^RUN/ {
              if ($0 ~ /apk |apt-get |apt |addgroup |adduser |groupadd |useradd |gem install |mkdir |chown |rm /) {
                print $0
                skip = 0
              } else {
                skip = 1
              }
              next
            }
            {
              if (skip) {
                # If the line does NOT end with a backslash, the skipped block is over
                if ($0 !~ /\\ *$/) skip = 0
              } else {
                print $0
              }
            }
          ' Dockerfile > Dockerfile.tmp && mv Dockerfile.tmp Dockerfile
          
          # Print the patched Dockerfile to the logs for easy debugging
          echo "Patched Dockerfile:"
          cat Dockerfile
          echo "-------------------"
          
          docker build -t test-app-${{ matrix.framework }}:latest .

      - name: DevSecOps Scan (Container Image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'test-app-${{ matrix.framework }}:latest'
          format: 'table'
          output: 'trivy-image-results.txt'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Publish Trivy Summary to GitHub Actions UI
        if: always()
        run: |
          echo "### 🏗️ Terraform Misconfiguration Scan (${{ matrix.framework }})" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-fs-results.txt ]; then cat trivy-fs-results.txt >> $GITHUB_STEP_SUMMARY; else echo "Scan failed or skipped."; fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🛡️ Container Security Scan Results (${{ matrix.framework }})" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-image-results.txt ]; then cat trivy-image-results.txt >> $GITHUB_STEP_SUMMARY; else echo "Container scan failed or skipped."; fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  validate-addons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scaffold backend with all addons
        env:
          CI_MOCK_AWS: 'true'
          DO_NOT_TRACK: '1'
        run: |
          TMPROOT=$(mktemp -d)
          APP_DIR="$TMPROOT/test-app-addons"
          mkdir -p "$APP_DIR"
          echo "GENERATED_DIR=$APP_DIR" >> "$GITHUB_ENV"
          cd "$APP_DIR"
          printf '{"scripts":{"db:migrate":"prisma migrate deploy"}}' > package.json
          printf 'web: node index.js\nworker: node worker.js\n' > Procfile
          node "$GITHUB_WORKSPACE/bin/cli.js" --headless --preconfigured --framework=nestjs --needsDatabase \
            --with storage:s3,db:dynamodb,db:redis,queue:sqs,ai:bedrock,email:ses,cron \
            --domain example.com --zone-id Z1234567890ABC --setup-ci-migrate
          node "$GITHUB_WORKSPACE/bin/cli.js" domain add example.com --zone-id Z1234567890ABC
          test -f terraform/ses.tf
          test -f terraform/bedrock.tf
          test -f terraform/cron.tf
          test -f terraform/worker.tf
          test -f terraform/domain.tf
          grep -q 'grada:db-migrate-start' .github/workflows/deploy.yml

      - name: Terraform Compile
        working-directory: ${{ env.GENERATED_DIR }}/terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Init TFLint
        working-directory: ${{ env.GENERATED_DIR }}/terraform
        run: tflint --init

      - name: Terraform Lint
        working-directory: ${{ env.GENERATED_DIR }}/terraform
        run: tflint

  validate-engines:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db-engine: [mysql, aurora-postgresql]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scaffold app (${{ matrix.db-engine }})
        env:
          CI_MOCK_AWS: 'true'
          DO_NOT_TRACK: '1'
        run: |
          TMPROOT=$(mktemp -d)
          APP_DIR="$TMPROOT/test-app-engine-${{ matrix.db-engine }}"
          mkdir -p "$APP_DIR"
          echo "GENERATED_DIR=$APP_DIR" >> "$GITHUB_ENV"
          cd "$APP_DIR"
          node "$GITHUB_WORKSPACE/bin/cli.js" --headless --preconfigured --framework=node --needsDatabase --db-engine ${{ matrix.db-engine }}
          test -f terraform/database.tf

      - name: Terraform Compile
        working-directory: ${{ env.GENERATED_DIR }}/terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Init TFLint
        working-directory: ${{ env.GENERATED_DIR }}/terraform
        run: tflint --init

      - name: Terraform Lint
        working-directory: ${{ env.GENERATED_DIR }}/terraform
        run: tflint
  validate-lambda:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: base
            scaffold: node "$GITHUB_WORKSPACE/bin/cli.js" --headless --preconfigured --framework=node --target lambda
            assert: test -f terraform/main.tf
          - name: aurora-addons-domain
            scaffold: |
              printf '{"scripts":{"db:migrate":"prisma migrate deploy"}}' > package.json
              printf 'web: node index.js\n' > Procfile
              node "$GITHUB_WORKSPACE/bin/cli.js" --headless --preconfigured --framework=node --target lambda --needsDatabase --db-engine aurora-postgresql \
                --with storage:s3,db:dynamodb,db:redis,queue:sqs,ai:bedrock,email:ses,cron \
                --domain example.com --zone-id Z1234567890ABC --setup-ci-migrate
              node "$GITHUB_WORKSPACE/bin/cli.js" domain add example.com --zone-id Z1234567890ABC
            assert: |
              test -f terraform/database.tf
              test -f terraform/ses.tf
              test -f terraform/bedrock.tf
              test -f terraform/cron.tf
              test -f terraform/redis.tf
              test -f terraform/domain.tf
              test ! -f terraform/worker.tf
              grep -q 'aws_lambda_function.app.arn' terraform/cron.tf
              grep -q 'random_password' terraform/database.tf
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scaffold lambda app (${{ matrix.name }})
        env:
          CI_MOCK_AWS: 'true'
          DO_NOT_TRACK: '1'
        run: |
          TMPROOT=$(mktemp -d)
          APP_DIR="$TMPROOT/test-app-lambda-${{ matrix.name }}"
          mkdir -p "$APP_DIR"
          echo "GENERATED_DIR=$APP_DIR" >> "$GITHUB_ENV"
          cd "$APP_DIR"
          ${{ matrix.scaffold }}
          ${{ matrix.assert }}

      - name: Terraform Compile
        working-directory: ${{ env.GENERATED_DIR }}/terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Init TFLint
        working-directory: ${{ env.GENERATED_DIR }}/terraform
        run: tflint --init

      - name: Terraform Lint
        working-directory: ${{ env.GENERATED_DIR }}/terraform
        run: tflint
