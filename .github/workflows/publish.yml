name: Publish CLI

on:
  release:
    types: [published]

jobs:
  validate:
    uses: ./.github/workflows/iac-validation.yml
    secrets: inherit

  build-and-publish:
    needs: [validate]
    runs-on: ubuntu-latest
    # Our own test runs must never emit telemetry, whatever a step spawns.
    env:
      DO_NOT_TRACK: '1'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade NPM for OIDC
        run: npm install -g npm@latest

      # NOTE: the PostHog ingestion key is a public client key baked into
      # src/core/telemetry.js on purpose — every distribution channel ships
      # working telemetry with no publish-time injection step.
      - name: Install dependencies
        run: npm install

      # Terraform on PATH before the tests: the unit suite shells out to
      # `terraform fmt -check` (tests/terraform-fmt.test.js).
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --- Phase 1: Static Generation Validation ---
      - name: Run Unit & Snapshot Tests
        run: npm test

      # --- Phase 2: Execution & Security Validation ---

      - name: Render templates for IaC scanning
        env:
          CI_MOCK_AWS: 'true'
        run: |
          SCAN_ROOT=$(mktemp -d)
          mkdir -p "$SCAN_ROOT/ecs" "$SCAN_ROOT/lambda" "$SCAN_ROOT/static"
          (cd "$SCAN_ROOT/ecs" && node "$GITHUB_WORKSPACE/bin/cli.js" init --target ecs --headless)
          (cd "$SCAN_ROOT/lambda" && node "$GITHUB_WORKSPACE/bin/cli.js" init --target lambda --headless)
          (cd "$SCAN_ROOT/static" && node "$GITHUB_WORKSPACE/bin/cli.js" init --target static --headless)
          echo "SCAN_ROOT=$SCAN_ROOT" >> "$GITHUB_ENV"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Init TFLint
        run: |
          (cd "$SCAN_ROOT/ecs/terraform" && tflint --init)
          (cd "$SCAN_ROOT/lambda/terraform" && tflint --init)
          (cd "$SCAN_ROOT/static/terraform" && tflint --init)

      - name: Run TFLint on rendered templates
        run: |
          (cd "$SCAN_ROOT/ecs/terraform" && tflint) || true
          (cd "$SCAN_ROOT/lambda/terraform" && tflint) || true
          (cd "$SCAN_ROOT/static/terraform" && tflint) || true

      - name: Run Trivy IaC Config Scanner (ECS)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '${{ env.SCAN_ROOT }}/ecs'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Run Trivy IaC Config Scanner (Lambda)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '${{ env.SCAN_ROOT }}/lambda'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Run Trivy IaC Config Scanner (Static)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '${{ env.SCAN_ROOT }}/static'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
      
      # --- Phase 3: Publish ---
      # Idempotent publishes: a re-run after a partial publish (or a
      # verification-only retry) must not fail on already-live versions.
      # Only the specific "already published" error is tolerated.
      - name: Publish Primary Package (grada-run)
        run: |
          OUT=$(npm publish --provenance 2>&1) && echo "$OUT" || {
            echo "$OUT"
            case "$OUT" in
              *"previously published versions"*) echo "grada-run already at this version, continuing." ;;
              *) exit 1 ;;
            esac
          }

      - name: Publish Scoped Alias (@grada-run/grada)
        run: |
          npm pkg set name="@grada-run/grada"
          OUT=$(npm publish --access public --provenance 2>&1) && echo "$OUT" || {
            echo "$OUT"
            case "$OUT" in
              *"previously published versions"*) echo "@grada-run/grada already at this version, continuing." ;;
              *) exit 1 ;;
            esac
          }

      # Dual-package lockstep: both packages must carry the release version,
      # or consumers chronically run one release behind. Verified against
      # the immutable version-doc endpoint — a never-before-requested URL,
      # so every read is a cache miss served from origin. Deliberately NOT
      # `npm view` (packument): packument reads stayed stale 10+ minutes
      # after the 0.40.3 publish (CDN edge TTL plus the CLI's own cache),
      # failing the release on versions that were already live. The
      # `latest` tag is printed best-effort only — it lives in the same
      # stale packument, so it can never be a fail criterion here.
      - name: Verify dual-package version lockstep
        run: |
          EXPECTED=$(node -p "require('./package.json').version")
          for PKG in grada-run @grada-run/grada; do
            ENCODED="${PKG//\//%2F}"
            OK=""
            for i in $(seq 1 30); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/${ENCODED}/${EXPECTED}" || echo 000)
              if [ "$CODE" = "200" ]; then OK=1; break; fi
              echo "Waiting for $PKG@$EXPECTED (registry: HTTP $CODE, attempt $i/30)..."
              sleep 10
            done
            if [ -z "$OK" ]; then
              echo "::error::$PKG@$EXPECTED not found on the registry after 5 minutes. Check the publish steps above."
              exit 1
            fi
            echo "$PKG@$EXPECTED published (latest tag: $(npm view "$PKG" version 2>/dev/null || echo unknown))"
          done