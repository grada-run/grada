name: Publish CLI

on:
  release:
    types: [published]

jobs:
  validate:
    uses: ./.github/workflows/iac-validation.yml
    secrets: inherit

  build-and-publish:
    needs: [validate]
    runs-on: ubuntu-latest
    # Our own test runs must never emit telemetry, whatever a step spawns.
    env:
      DO_NOT_TRACK: '1'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade NPM for OIDC
        run: npm install -g npm@latest

      # NOTE: the PostHog ingestion key is a public client key baked into
      # src/core/telemetry.js on purpose — every distribution channel ships
      # working telemetry with no publish-time injection step.
      - name: Install dependencies
        run: npm install

      # Terraform on PATH before the tests: the unit suite shells out to
      # `terraform fmt -check` (tests/terraform-fmt.test.js).
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --- Phase 1: Static Generation Validation ---
      - name: Run Unit & Snapshot Tests
        run: npm test

      # --- Phase 2: Execution & Security Validation ---

      - name: Render templates for IaC scanning
        env:
          CI_MOCK_AWS: 'true'
        run: |
          SCAN_ROOT=$(mktemp -d)
          mkdir -p "$SCAN_ROOT/ecs" "$SCAN_ROOT/lambda" "$SCAN_ROOT/static"
          (cd "$SCAN_ROOT/ecs" && node "$GITHUB_WORKSPACE/bin/cli.js" init --target ecs --headless)
          (cd "$SCAN_ROOT/lambda" && node "$GITHUB_WORKSPACE/bin/cli.js" init --target lambda --headless)
          (cd "$SCAN_ROOT/static" && node "$GITHUB_WORKSPACE/bin/cli.js" init --target static --headless)
          echo "SCAN_ROOT=$SCAN_ROOT" >> "$GITHUB_ENV"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Init TFLint
        run: |
          (cd "$SCAN_ROOT/ecs/terraform" && tflint --init)
          (cd "$SCAN_ROOT/lambda/terraform" && tflint --init)
          (cd "$SCAN_ROOT/static/terraform" && tflint --init)

      - name: Run TFLint on rendered templates
        run: |
          (cd "$SCAN_ROOT/ecs/terraform" && tflint) || true
          (cd "$SCAN_ROOT/lambda/terraform" && tflint) || true
          (cd "$SCAN_ROOT/static/terraform" && tflint) || true

      - name: Run Trivy IaC Config Scanner (ECS)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '${{ env.SCAN_ROOT }}/ecs'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Run Trivy IaC Config Scanner (Lambda)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '${{ env.SCAN_ROOT }}/lambda'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Run Trivy IaC Config Scanner (Static)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '${{ env.SCAN_ROOT }}/static'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
      
      # --- Phase 3: Publish ---
      # The publish response is the acceptance signal. npm acknowledges a
      # publish before the version is servable ("being processed ... may
      # take a few minutes"), so only the write path can confirm
      # acceptance — registry reads may 404 for 10+ minutes afterwards
      # (0.40.2/0.40.3/0.40.4 each failed a hard read-back gate on live
      # versions). Each step therefore asserts npm's own success line.
      # Idempotent publishes: a re-run after a partial publish (or a
      # verification-only retry) must not fail on already-live versions.
      # The "previously published" conflict comes from the write path,
      # which knows the version exists even while reads still 404, so it
      # is trusted as confirmation. Only that specific error is tolerated.
      - name: Publish Primary Package (grada-run)
        run: |
          EXPECTED=$(node -p "require('./package.json').version")
          if OUT=$(npm publish --provenance 2>&1); then
            echo "$OUT"
            case "$OUT" in
              *"grada-run@${EXPECTED}"*) ;;
              *) echo "::error::npm publish exited 0 but did not confirm grada-run@${EXPECTED}."; exit 1 ;;
            esac
          else
            echo "$OUT"
            case "$OUT" in
              *"previously published versions"*) echo "grada-run already at this version, continuing." ;;
              *) exit 1 ;;
            esac
          fi

      - name: Publish Scoped Alias (@grada-run/grada)
        run: |
          npm pkg set name="@grada-run/grada"
          EXPECTED=$(node -p "require('./package.json').version")
          if OUT=$(npm publish --access public --provenance 2>&1); then
            echo "$OUT"
            case "$OUT" in
              *"@grada-run/grada@${EXPECTED}"*) ;;
              *) echo "::error::npm publish exited 0 but did not confirm @grada-run/grada@${EXPECTED}."; exit 1 ;;
            esac
          else
            echo "$OUT"
            case "$OUT" in
              *"previously published versions"*) echo "@grada-run/grada already at this version, continuing." ;;
              *) exit 1 ;;
            esac
          fi

      # Dual-package lockstep confirmation (ADVISORY ONLY — never fails the
      # job). Both packages must carry the release version, or consumers
      # chronically run one release behind — but npm exposes new versions
      # minutes after accepting them, so a read-back gate can only confirm,
      # never convict. The write acknowledgement asserted in the publish
      # steps above is the acceptance signal; this step just confirms early
      # when the registry exposes the version quickly.
      - name: Confirm dual-package version lockstep (advisory)
        run: |
          EXPECTED=$(node -p "require('./package.json').version")
          for PKG in grada-run @grada-run/grada; do
            ENCODED="${PKG//\//%2F}"
            OK=""
            for i in $(seq 1 12); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/${ENCODED}/${EXPECTED}" || echo 000)
              if [ "$CODE" = "200" ]; then OK=1; break; fi
              sleep 10
            done
            if [ -z "$OK" ]; then
              echo "::notice::$PKG@$EXPECTED not yet visible on the registry (npm exposes new versions minutes after accepting them). The publish step above confirmed acceptance — no action needed."
            else
              echo "$PKG@$EXPECTED visible on the registry."
            fi
          done